<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>OG Template — LunenLabs</title>
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1280px; height: 720px; overflow: hidden;
        font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; letter-spacing: -0.02em;
      }
      .og {
        position: relative; width: 1280px; height: 720px; padding: 72px 80px; color: #fff;
        display: flex; flex-direction: column; justify-content: space-between;
        background:
          radial-gradient(55% 50% at 82% 12%, rgba(0, 201, 176, 0.22) 0%, transparent 60%),
          radial-gradient(50% 55% at 10% 90%, rgba(27, 44, 88, 0.9) 0%, transparent 70%),
          linear-gradient(180deg, #0f1626 0%, #0a1a3f 100%);
      }
      .grid {
        position: absolute; inset: 0; opacity: 0.6;
        background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .top, .body, .row { position: relative; }
      .top { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 700; }
      .logo { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #0A1A3F, #00C9B0); border: 2px solid rgba(255,255,255,0.15); }
      h1 { font-size: 76px; line-height: 1.1; font-weight: 800; }
      h1 .accent { background: linear-gradient(90deg, #00C9B0, #E0FAF5); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .sub { margin-top: 22px; font-size: 26px; color: rgba(255,255,255,0.7); font-weight: 500; }
      .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .chip {
        display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 20px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      }
      .chip img, .chip .glyph { width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; }
      .glyph { display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
      .nw { background: #0F1626; border: 1px solid rgba(0,201,176,0.5); color: #00C9B0; font-family: ui-monospace, Consolas, monospace; }
      .sd { background: #E0FAF5; color: #0A1A3F; }
      .name { font-size: 22px; font-weight: 800; }
      .what { font-size: 15px; color: rgba(255,255,255,0.6); margin-top: 3px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="grid"></div>
      <div class="top"><span class="logo"></span>LunenLabs · 루넨랩스</div>
      <div class="body">
        <h1>작은 일상과 단단한 코드를<br /><span class="accent">만드는 스튜디오</span></h1>
        <p class="sub">강아지 산책 · 아이 나들이 기록 앱, 그리고 AI 시대의 품질 도구</p>
      </div>
      <div class="row">
        <div class="chip"><img src="public/dangmasil/img/icon.png" alt="" /><div><div class="name">댕마실</div><div class="what">강아지 산책 기록</div></div></div>
        <div class="chip"><img src="public/poljjak/img/icon.png" alt="" /><div><div class="name">폴짝</div><div class="what">아이 나들이 기록</div></div></div>
        <div class="chip"><span class="glyph nw">nw</span><div><div class="name">nightward</div><div class="what">AI 변경 회귀 게이트</div></div></div>
        <div class="chip"><span class="glyph sd">SD</span><div><div class="name">SDET Code</div><div class="what">테스트 자동화</div></div></div>
      </div>
    </div>
  </body>
</html>
